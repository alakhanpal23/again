name: Service CI

on:
  pull_request:
    paths:
      - "service/**"
      - ".github/workflows/service-ci.yml"
  push:
    paths:
      - "service/**"
      - ".github/workflows/service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: service
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: service/package-lock.json

      - name: Use the declared npm release
        run: npm install --global npm@11.6.1

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Cloudflare binding types
        run: npm run cf-typegen

      - name: Verify generated types are committed
        run: git diff --exit-code -- worker-configuration.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build the deploy bundle without publishing
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Test
        run: npm test
