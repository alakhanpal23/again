name: linux-supervisor-qualification

# Provisioning, security, one-job registration, and teardown:
# docs/LINUX_SUPERVISOR_RUNNER.md

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-supervisor-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Disposable hosted Linux supervisor 100-sample qualification
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect native nested virtualization
        run: |
          uname -a
          ls -l /dev/kvm
          grep -Ec '(vmx|svm)' /proc/cpuinfo
          sudo lxd init --auto
          sudo lxc image list ubuntu:24.04 --format json
          sudo lxc launch ubuntu:24.04 again-qualification --vm \
            -c limits.cpu=2 -c limits.memory=4GiB
          ready=false
          for _ in $(seq 1 60); do
            if sudo lxc exec again-qualification -- true 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          sudo lxc exec again-qualification -- cloud-init status --wait
          test "$(sudo lxc exec again-qualification -- uname -m)" = x86_64
          test "$(sudo lxc exec again-qualification -- systemd-detect-virt --vm)" = kvm
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy
      - name: Require the provisioned kernel contract
        run: sudo --preserve-env=PATH scripts/preflight_linux_supervisor_runner.sh
      - name: Strict Linux source validation
        run: cargo +1.88.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Build the fixed diagnostic
        run: cargo +1.88.0 build --locked --features linux-pytest --bin again
      - name: Require 100 samples and both kernel fork-delivery orders
        run: |
          sudo lxc exec again-qualification -- apt-get update -qq
          sudo lxc exec again-qualification -- apt-get install -y jq
          sudo lxc file push target/debug/again again-qualification/root/again
          sudo lxc file push scripts/preflight_linux_supervisor_runner.sh \
            again-qualification/root/preflight_linux_supervisor_runner.sh
          sudo lxc file push scripts/qualify_linux_supervisor.sh \
            again-qualification/root/qualify_linux_supervisor.sh
          sudo lxc exec again-qualification -- chmod 700 \
            /root/again \
            /root/preflight_linux_supervisor_runner.sh \
            /root/qualify_linux_supervisor.sh
          sudo lxc exec again-qualification -- \
            /root/preflight_linux_supervisor_runner.sh
          sudo lxc exec again-qualification -- env \
            GITHUB_SHA="$GITHUB_SHA" \
            AGAIN_SUPERVISOR_BINARY=/root/again \
            AGAIN_SUPERVISOR_EVIDENCE_DIR=/root/linux-supervisor-qualification \
            /root/qualify_linux_supervisor.sh
          sudo lxc file pull --recursive \
            again-qualification/root/linux-supervisor-qualification .
      - name: Destroy the disposable qualification guest
        if: always()
        run: sudo lxc delete --force again-qualification 2>/dev/null || true
      - name: Return evidence ownership to the unprivileged job user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" linux-supervisor-qualification 2>/dev/null || true
      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-supervisor-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: linux-supervisor-qualification/
          if-no-files-found: error
          retention-days: 30
