name: native beta qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch, tag, or commit to qualify
        required: true
        type: string
      version:
        description: SemVer archive label (including leading v)
        required: true
        default: v0.1.0-beta.1
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-smoke:
    name: qualify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build the daemon-only candidate
        run: cargo +1.88.0 build --release --locked --no-default-features --features daemon
      - name: Package and exercise the installed product
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          source_epoch=$(git show -s --format=%ct HEAD)
          mkdir -p dist
          archive="dist/again-${VERSION}-${TARGET}.tar.gz"
          report="dist/again-${VERSION}-${TARGET}.native-smoke.json"
          python3 scripts/package_release.py \
            --binary target/release/again \
            --output "$archive" \
            --source-date-epoch "$source_epoch"
          python3 scripts/smoke_release_package.py \
            --archive "$archive" \
            --version "$VERSION" \
            --source-git-sha "$source_sha" \
            --evidence-output "$report"
      - name: Retain native archive and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-beta-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/again-${{ inputs.version }}-${{ matrix.target }}.tar.gz
            dist/again-${{ inputs.version }}-${{ matrix.target }}.native-smoke.json
