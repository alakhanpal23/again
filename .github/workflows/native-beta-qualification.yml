name: native beta qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-hex source commit to qualify
        required: true
        type: string
      version:
        description: SemVer archive label (including leading v)
        required: true
        default: v0.1.0-beta.1
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native-smoke:
    name: qualify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Validate immutable source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'source_ref must be an exact lowercase 40-hex commit' >&2
            exit 1
          }
      - name: Check out the exact requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build the daemon-only candidate
        run: cargo +1.88.0 build --release --locked --no-default-features --features daemon
      - name: Package and exercise the installed product
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          source_epoch=$(git show -s --format=%ct HEAD)
          evidence_dir="$RUNNER_TEMP/again-native-${TARGET}"
          test ! -e "$evidence_dir"
          mkdir -m 700 "$evidence_dir"
          archive="$evidence_dir/again-${VERSION}-${TARGET}.tar.gz"
          report="$evidence_dir/again-${VERSION}-${TARGET}.native-smoke.json"
          python3 scripts/package_release.py \
            --binary target/release/again \
            --output "$archive" \
            --source-date-epoch "$source_epoch"
          python3 scripts/smoke_release_package.py \
            --archive "$archive" \
            --version "$VERSION" \
            --source-git-sha "$source_sha" \
            --evidence-output "$report"
      - name: Retain native archive and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-beta-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/again-native-${{ matrix.target }}/again-${{ inputs.version }}-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/again-native-${{ matrix.target }}/again-${{ inputs.version }}-${{ matrix.target }}.native-smoke.json

  aggregate-native-evidence:
    name: bind four native reports to one source
    needs: native-smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Download every native report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-beta-*
          merge-multiple: true
          path: native-evidence
      - name: Verify exact target and source convergence
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import glob, json, os
          targets = {
              "aarch64-apple-darwin", "x86_64-apple-darwin",
              "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu",
          }
          paths = glob.glob("native-evidence/*.native-smoke.json")
          reports = [json.load(open(path, encoding="utf-8")) for path in paths]
          if len(reports) != 4 or {item.get("target") for item in reports} != targets:
              raise SystemExit("native report target matrix is incomplete or duplicated")
          if {item.get("source_git_sha") for item in reports} != {os.environ["SOURCE_SHA"]}:
              raise SystemExit("native reports do not bind to one requested source commit")
          if any(item.get("classification", {}).get("type") != "pass" for item in reports):
              raise SystemExit("a native report did not pass")
          with open("native-evidence/native-matrix-summary.json", "w", encoding="utf-8") as output:
              json.dump({"source_git_sha": os.environ["SOURCE_SHA"], "targets": sorted(targets)}, output, sort_keys=True)
              output.write("\n")
          PY
      - name: Retain matrix convergence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-beta-matrix-summary
          if-no-files-found: error
          retention-days: 30
          path: native-evidence/native-matrix-summary.json
