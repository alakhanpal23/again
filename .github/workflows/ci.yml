name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-capability-evidence:
    name: Linux bootstrap evidence (stock rootless refusal required)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build the independent read-only capability probe
        run: rustc +1.88.0 --edition 2024 -D warnings ci/linux_capability_probe.rs -o linux-capability-probe
      - name: Build the fixed Again Linux diagnostics
        run: cargo +1.88.0 build --locked --bin again
      - name: Collect typed hosted Linux capability evidence
        id: capability-probe
        shell: bash
        run: |
          set +e
          ./linux-capability-probe > linux-capability-report.json
          probe_exit=$?
          set -e
          echo "exit_code=${probe_exit}" >> "${GITHUB_OUTPUT}"
          jq -e --argjson probe_exit "${probe_exit}" '
            def integer: type == "number" and . == floor;
            (keys == [
              "platform", "process", "results", "runner", "schema", "scope",
              "security", "summary"
            ])
            and .schema == "again.linux-capability-evidence.v1"
            and (.scope | type == "object"
              and keys == ["host_policy_mutated", "kind", "profile_qualification"]
              and .kind == "hosted_ci_capability_evidence"
              and .profile_qualification == false
              and .host_policy_mutated == false)
            and (.runner | type == "object"
              and has("image_os") and has("image_version")
              and has("runner_os") and has("runner_arch") and has("github_sha"))
            and (.platform | type == "object"
              and .os == "linux" and (.arch | type == "string")
              and has("kernel_release") and has("kernel_version") and has("glibc"))
            and (.process | type == "object"
              and (.uid | integer) and (.euid | integer)
              and (.gid | integer) and (.egid | integer)
              and (.capabilities | type == "object")
              and has("no_new_privs") and has("seccomp") and has("seccomp_filters"))
            and (.security | type == "object"
              and has("lsm") and has("apparmor_profile") and (.sysctls | type == "object"))
            and (.results | type == "object")
            and (.results | keys == [
              "close_range_unshare",
              "landlock_abi",
              "openat2",
              "ordinary_unprivileged_user",
              "user_namespace"
            ])
            and (all(.results[];
              (keys == ["errno", "evidence", "reason", "stage", "status"])
              and (.status == "supported" or .status == "unavailable" or .status == "broken")
              and (.reason | type == "string" and length > 0)
              and (.stage | type == "string" and length > 0)
              and (.errno == null or (.errno | integer))
              and (.evidence | type == "object")
            ))
            and (.summary | type == "object"
              and keys == ["broken", "exit_code", "supported", "unavailable"]
              and (.supported | integer) and .supported >= 0
              and (.unavailable | integer) and .unavailable >= 0
              and (.broken | integer) and .broken >= 0
              and (.exit_code | integer))
            and (.summary.supported + .summary.unavailable + .summary.broken == 5)
            and .summary.exit_code == $probe_exit
            and .summary.supported == ([.results[].status | select(. == "supported")] | length)
            and .summary.unavailable == ([.results[].status | select(. == "unavailable")] | length)
            and .summary.broken == ([.results[].status | select(. == "broken")] | length)
            and (
              (.summary.broken > 0 and $probe_exit == 1)
              or (.summary.broken == 0 and .summary.unavailable > 0 and $probe_exit == 77)
              or (.summary.broken == 0 and .summary.unavailable == 0 and $probe_exit == 0)
            )
          ' linux-capability-report.json > /dev/null
          case "${probe_exit}" in
            0)
              echo "Five narrow hosted-runner probes passed; linux-pytest-v1 remains NOT QUALIFIED."
              {
                echo "### Linux capability inventory"
                echo "✅ Five narrow probes passed. **linux-pytest-v1 remains NOT QUALIFIED.**"
                echo "This informational lane cannot qualify the execution profile."
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
            77)
              echo "::warning::At least one hosted-runner capability is unavailable; linux-pytest-v1 remains NOT QUALIFIED."
              {
                echo "### Linux capability inventory"
                echo "⚠️ At least one narrow probe is unavailable. **linux-pytest-v1 remains NOT QUALIFIED.**"
                echo "Exit 77 is accepted only for this non-qualifying evidence lane; inspect the report artifact."
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "::error::Hosted Linux capability probe found a broken invariant (exit ${probe_exit})."
              {
                echo "### Linux capability inventory"
                echo "❌ A probe invariant is broken (exit ${probe_exit}). **linux-pytest-v1 remains NOT QUALIFIED.**"
              } >> "${GITHUB_STEP_SUMMARY}"
              exit "${probe_exit}"
              ;;
          esac
      - name: Require an exact typed stock-runner rootless non-pass
        shell: bash
        run: |
          set +e
          target/debug/again __linux-pytest-namespace-probe-v1 \
            > linux-namespace-bootstrap-report.json \
            2> linux-namespace-bootstrap.stderr
          probe_exit=$?
          set -e
          test "${probe_exit}" -eq 77
          test ! -s linux-namespace-bootstrap.stderr
          jq -e '
            (keys == ["profile_id", "refusal", "schema", "scope", "status"])
            and .schema == "again.linux-pytest-namespace-probe.v1"
            and .profile_id == "linux-pytest-v1"
            and .status == "unavailable"
            and (.scope | keys == [
              "accepts_command", "execution_authority", "kind", "profile_qualification"
            ])
            and .scope.kind == "fixed_no_command_namespace_bootstrap"
            and .scope.profile_qualification == false
            and .scope.accepts_command == false
            and .scope.execution_authority == false
            and (.refusal | keys == ["cleanup_complete", "code", "errno", "reason", "stage"])
            and .refusal.cleanup_complete == true
            and (
              (.refusal.code == "isolation_preflight_failed"
                and .refusal.stage == "host_swap_preflight"
                and .refusal.reason == "host_swap_enabled"
                and .refusal.errno == null)
              or
              (.refusal.code == "required_namespace_failed"
                and .refusal.stage == "child_uts_configuration"
                and .refusal.reason == "administrative_policy"
                and .refusal.errno == 1)
            )
          ' linux-namespace-bootstrap-report.json > /dev/null
          jq -e '
            .results.user_namespace.status == "unavailable"
            and .results.user_namespace.reason == "user_namespace_unavailable"
            and .results.user_namespace.stage == "unshare_user"
            and .results.user_namespace.errno == 13
          ' \
            linux-capability-report.json > /dev/null
          {
            echo "### Fixed namespace bootstrap"
            echo "✅ The stock Ubuntu runner produced one exact typed environmental non-pass before any workload surface."
            echo "The accepted shapes are active host swap at the new pre-clone policy boundary or the previously retained UTS-policy EPERM after verified child setup."
            echo "The independent unshare route was separately denied with EACCES."
            echo "The diagnostic remains non-qualifying and grants no execution authority."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Require the fixed ptrace transport proof
        shell: bash
        run: |
          : > linux-ptrace-transport-validated.jsonl
          mkdir -p linux-ptrace-transport-samples
          for iteration in {1..32}; do
            printf -v sample_dir 'linux-ptrace-transport-samples/%02d' "${iteration}"
            mkdir -p "${sample_dir}"
            set +e
            target/debug/again __linux-pytest-ptrace-transport-probe-v1 \
              > "${sample_dir}/stdout.raw" \
              2> "${sample_dir}/stderr.raw"
            probe_exit=$?
            printf '%d\n' "${probe_exit}" > "${sample_dir}/exit-status.txt"
            status_write_exit=$?
            set -e
            test "${status_write_exit}" -eq 0
            test "${probe_exit}" -eq 0
            test ! -s "${sample_dir}/stderr.raw"
            jq -c -s -e --argjson iteration "${iteration}" '
              select(
                length == 1
                and (.[0] |
                  (keys == ["profile_id", "refusal", "result", "schema", "scope", "status"])
                  and .schema == "again.linux-pytest-ptrace-transport-probe.v1"
                  and .profile_id == "linux-pytest-v1"
                  and .status == "completed"
                  and .refusal == null
                  and (.scope | keys == [
                    "accepts_command", "effect_ir_authority", "execution_authority", "kind",
                    "profile_qualification", "reuse_authority"
                  ])
                  and .scope.kind == "fixed_no_command_ptrace_transport"
                  and .scope.profile_qualification == false
                  and .scope.accepts_command == false
                  and .scope.effect_ir_authority == false
                  and .scope.execution_authority == false
                  and .scope.reuse_authority == false
                  and (.result | keys == [
                    "cleanup_complete", "event_count", "logical_task_id", "lost_event_count",
                    "protocol_fingerprint", "ptrace_exit_event_count", "seccomp_stop_count",
                    "task_count", "terminal_reap_count", "unknown_event_count"
                  ])
                  and .result.logical_task_id == 1
                  and .result.task_count == 1
                  and .result.event_count == 4
                  and .result.seccomp_stop_count == 2
                  and .result.ptrace_exit_event_count == 1
                  and .result.terminal_reap_count == 1
                  and .result.unknown_event_count == 0
                  and .result.lost_event_count == 0
                  and .result.cleanup_complete == true
                  and .result.protocol_fingerprint == "f4101836ef74bb4f"
                )
              )
              | .[0] + {iteration: $iteration}
            ' \
              "${sample_dir}/stdout.raw" \
              >> linux-ptrace-transport-validated.jsonl
          done
          jq -s -e '
            select(
              length == 32
              and ([.[].iteration] == [range(1; 33)])
            )
            | {
                schema: "again.linux-pytest-ptrace-transport-ci.v1",
                validated_sample_count: length,
                first_iteration: .[0].iteration,
                last_iteration: .[-1].iteration
              }
          ' linux-ptrace-transport-validated.jsonl \
            > linux-ptrace-transport-report.json
          {
            echo "### Fixed ptrace transport"
            echo "✅ 32/32 no-command probes observed the exact two seccomp stops, exit event, terminal reap, and cleanup proof."
            echo "This transport diagnostic grants no EffectIR, execution, profile, or reuse authority."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the hosted Linux capability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-capability-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            linux-capability-report.json
            linux-namespace-bootstrap-report.json
            linux-namespace-bootstrap.stderr
            linux-ptrace-transport-report.json
            linux-ptrace-transport-validated.jsonl
            linux-ptrace-transport-samples/
          if-no-files-found: error
          retention-days: 30

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.88.0 fmt --check
      - run: cargo +1.88.0 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.88.0 test --locked --all-features
      - name: Audit locked Rust dependencies
        if: runner.os == 'Linux'
        run: |
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
          cargo +1.88.0 audit
      - name: Test the offline Linux supervisor evidence verifier
        run: python3 -B -m unittest scripts/test_verify_linux_supervisor_evidence.py
      - name: Test the offline Linux pytest execute-only evidence verifier
        run: python3 -B -m unittest scripts/test_verify_linux_pytest_execute_only_evidence.py
      - name: Test the offline Linux pytest execute-only evidence packager
        run: python3 -B -m unittest scripts/test_package_linux_pytest_execute_only_evidence.py
      - name: Test the Linux pytest execute-only acceptance oracle
        run: python3 -B -m unittest bench/test_linux_pytest_execute_only_evidence.py
      - name: Test the Linux pytest execute-only snapshot oracle
        run: python3 -B -m unittest bench/test_linux_pytest_execute_only_snapshot.py
      - name: Test the real-repository corpus harness
        run: python3 -B -m unittest bench/test_real_repository_corpus.py
      - name: Test the Linux supervisor qualification harness
        if: runner.os == 'Linux'
        run: scripts/test_linux_supervisor_qualification.sh
      - name: Test the provisioned Linux runner preflight
        if: runner.os == 'Linux'
        run: scripts/test_linux_supervisor_runner_preflight.sh
      - name: Run the deterministic 100,000-case gate
        run: cargo +1.88.0 test --locked --test generated_differential generated_differential_100k -- --ignored --exact --nocapture
