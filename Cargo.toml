[package]
name = "again-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Proof-carrying reuse and compact output for agent tool calls"
license = "Apache-2.0"
repository = "https://github.com/alakhanpal23/again"

[lib]
name = "again"
path = "src/lib.rs"

[[bin]]
name = "again"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
