[package]
name = "again-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Proof-carrying reuse for agent tool calls"
license = "Apache-2.0"
repository = "https://github.com/alakhanpal23/again"

[lib]
name = "again"
path = "src/lib.rs"

[[bin]]
name = "again"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = { version = "1", features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2.1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "=1.9.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
